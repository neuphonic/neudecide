[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neudecide"
version = "0.1.0"
authors = [
  { name="neuphonic", email="general@neuphonic.com" },
]
description = "NeuDecide - a tiny on-device model that turns speech into tool calls."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10, <3.14"
dependencies = [
    "huggingface_hub>=0.20",
    "numpy>=1.24",
    "onnxruntime>=1.17",
]

[tool.setuptools.packages.find]
include = ["neudecide*"]

[tool.pytest.ini_options]
markers = ["slow: downloads the model from the Hugging Face Hub"]
